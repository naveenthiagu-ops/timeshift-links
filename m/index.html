<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening TimeShift...</title>
<style>
  body {
    font-family: -apple-system, Roboto, Helvetica, Arial, sans-serif;
    background: #0f1115;
    color: #f2f2f2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  h1 { font-size: 1.25rem; margin-bottom: 8px; }
  p { color: #9aa0a6; margin-top: 0; }
  .code { font-size: 1.5rem; letter-spacing: 0.15em; font-weight: 700; color: #f2f2f2; margin: 16px 0 0; }
  a.button {
    display: inline-block;
    margin-top: 20px;
    padding: 12px 24px;
    background: #4f8cff;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: 600;
  }
</style>
</head>
<body>
  <h1>Opening your manager invite&hellip;</h1>
  <p>If the app doesn&rsquo;t open automatically, tap the button below.</p>
  <a class="button" id="open-link" href="#">Open in TimeShift</a>
  <p class="code" id="code"></p>
  <p id="code-help"></p>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var code = (params.get('c') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (!/^[A-HJ-NP-Z2-9]{8}$/.test(code)) {
        document.querySelector('h1').textContent = 'Invite link incomplete';
        document.querySelector('p').textContent = 'This link is missing its invite code. Ask the venue owner to send it again.';
        document.getElementById('open-link').style.display = 'none';
        return;
      }
      // Shown so the code can be typed in the app (Owner Portal > I have a manager invite code)
      // if the app link doesn't open.
      document.getElementById('code').textContent = code;
      document.getElementById('code-help').textContent =
        'Or open TimeShift > Owner Portal > "I have a manager invite code" and type this code.';
      var deepLink = 'timeshift://manager-invite/' + code;
      document.getElementById('open-link').setAttribute('href', deepLink);
      // Best-effort automatic redirect; the visible button above is the
      // reliable fallback for browsers that block programmatic scheme
      // navigation (notably in-app browsers inside messaging apps).
      window.location.href = deepLink;
    })();
  </script>
</body>
</html>
